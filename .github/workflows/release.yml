name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze project source
        run: flutter analyze
      
      - name: Run tests
        run: flutter test
      
      - name: Generate assets
        run: fvm dart run build_runner build

  build-example:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      
      - name: Install dependencies
        run: |
          flutter pub get
          cd example && flutter pub get
      
      - name: Build example app
        run: cd example && flutter build apk --release

  create-release:
    runs-on: ubuntu-latest
    needs: [test, build-example]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate changelog
        id: changelog
        run: |
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/}
          
          # Generate changelog from git commits
          CHANGELOG=$(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD)
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          release_name: Release ${{ steps.changelog.outputs.version }}
          body: |
            ## 🎉 What's New in ${{ steps.changelog.outputs.version }}
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ## 📦 Installation
            
            ```yaml
            dependencies:
              design_system_project:
                git:
                  url: https://github.com/${{ github.repository }}.git
                  ref: ${{ steps.changelog.outputs.version }}
            ```
            
            ## 📚 Documentation
            
            - [README](README.md)
            - [Catalog Guide](CATALOG_README.md)
            - [Quick Start](QUICK_START.md)
            - [Changelog](CHANGELOG.md)
            
            ## 🧪 Testing
            
            ```bash
            flutter test
            flutter analyze
            flutter run -t lib/catalog/main.dart
            ```
            
            ---
            
            **Happy coding! 🚀**
          draft: false
          prerelease: false 